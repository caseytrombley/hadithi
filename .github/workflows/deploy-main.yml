name: Deploy with Firebase

on:
  push:
    branches:
      - main
      - master

jobs:
  firebase-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@master
      - name: Install node
        uses: actions/setup-node@master
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install --force
      - name: Build
        run: npm run build
        env:
          VUE_APP_FIREBASE_API_KEY: ${{ secrets.VUE_APP_FIREBASE_API_KEY }}
          VUE_APP_FIREBASE_DOMAIN: ${{ secrets.VUE_APP_FIREBASE_DOMAIN }}
          VUE_APP_FIREBASE_DB_URL: ${{ secrets.VUE_APP_FIREBASE_DB_URL }}
          VUE_APP_FIREBASE_PROJECT_ID: ${{ secrets.VUE_APP_FIREBASE_PROJECT_ID }}
          VUE_APP_FIREBASE_DB_TABLE_URL: ${{ secrets.VUE_APP_FIREBASE_DB_TABLE_URL }}
          VUE_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.VUE_APP_FIREBASE_STORAGE_BUCKET }}
          VUE_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VUE_APP_FIREBASE_MESSAGING_SENDER_ID }}
          VUE_APP_FIREBASE_API_ID: ${{ secrets.VUE_APP_FIREBASE_API_ID }}
          VUE_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.VUE_APP_FIREBASE_MEASUREMENT_ID }}
          VUE_APP_GRAMMARLY_CLIENT_ID: ${{ secrets.VUE_APP_GRAMMARLY_CLIENT_ID }}
          VUE_APP_RSS_FEED: ${{ secrets.VUE_APP_RSS_FEED }}
          VUE_APP_API_URL: ${{ secrets.VUE_APP_API_URL }}
      - name: Deploy with Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTER_1234 }}'

